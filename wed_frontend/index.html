<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amore — Wedding Planning & Vendor Booking</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Romantic ambient particles -->
  <div class="petal-bg" id="petalBg"></div>

  <!-- Include navbar -->
  <div w3-include-html="components/navbar.html"></div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <p class="hero-eyebrow">💍   Your love story, perfectly orchestrated   💍</p>
      <h1>Plan Your<br><em>Dream Wedding</em></h1>
      <p class="hero-sub">A modern wedding planning system built with Java OOP elegance — connecting couples with the finest vendors seamlessly.</p>
      <div class="hero-btns">
        <button class="btn-primary" onclick="document.getElementById('budget').scrollIntoView({behavior:'smooth'})">Manage Budget</button>
        <button class="btn-outline" onclick="document.getElementById('payment').scrollIntoView({behavior:'smooth'})">Handle Payments</button>
      </div>
    </div>
    <div class="scroll-hint"><div class="line"></div>SCROLL</div>
  </section>

  <!-- BUDGET MANAGEMENT -->
  <div w3-include-html="components/budget.html"></div>

  <!-- PAYMENT MANAGEMENT -->
  <div w3-include-html="components/payment.html"></div>

  <!-- Include footer -->
  <div w3-include-html="components/footer.html"></div>

  <script src="js/script.js"></script>
  <script>
    // Simple include function for HTML components
    function includeHTML() {
      var z, i, elmnt, file, xhttp;
      z = document.getElementsByTagName("*");
      for (i = 0; i < z.length; i++) {
        elmnt = z[i];
        file = elmnt.getAttribute("w3-include-html");
        if (file) {
          xhttp = new XMLHttpRequest();
          xhttp.onreadystatechange = function() {
            if (this.readyState == 4) {
              if (this.status == 200) {elmnt.innerHTML = this.responseText;}
              if (this.status == 404) {elmnt.innerHTML = "Page not found.";}
              elmnt.removeAttribute("w3-include-html");
              includeHTML();
            }
          }
          xhttp.open("GET", file, true);
          xhttp.send();
          return;
        }
      }
    }
    includeHTML();
  </script>
</body>
</html>
